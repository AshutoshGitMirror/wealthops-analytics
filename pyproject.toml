[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wealthops-analytics"
version = "0.1.0"
description = "Synthetic wealth-management analytics workbench: SQL KPIs, DuckDB marts and a Streamlit dashboard"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "WealthOps project"}]
dependencies = [
    # DuckDB 2.x uses CPU instructions unavailable on the target AVX-only machine.
    "duckdb==1.1.3",
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "pyarrow>=15,<27",
    "streamlit>=1.40,<2",
    "plotly>=5.24,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
wealthops = "wealthops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
